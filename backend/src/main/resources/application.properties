# Profile
spring.profile.active=default

# Hibernate
spring.hibernate.ddl-auto=update

# Datasource
spring.datasource.password=sicheresPasswort3
spring.datasource.username=postgres
spring.datasource.url=jdbc:postgresql://192.168.0.15:5432/postgres?currentSchema=calory
spring.datasource.driverClassName=org.postgresql.Driver

# Flyway
spring.flyway.enabled=true
spring.flyway.check-location=false
spring.flyway.locations=classpath:/db/migration/

# Logging
logging.level.com.zaxxer.hikari=DEBUG
# Extends Spring Boot's default console pattern with the requestId/user MDC values that
# RequestTracingFilter sets for the duration of every request, so every log line - regardless of
# which usecase wrote it - is traceable to the request and (if authenticated) user that caused it.
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId:--},%X{user:-anonymous}]){yellow} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}

# Security
# JWT_SECRET must be provided as an environment variable (>= 256 bit / 32 chars).
# There is intentionally no fallback here so a misconfigured deployment fails fast.
jwt.secret=2cMcbtVuWT8mPEUjXHiBhb0tSeDuGTmXFoduH5BcTA4

# Food CSV import
spring.servlet.multipart.max-file-size=-1
spring.servlet.multipart.max-request-size=-1
spring.jpa.properties.hibernate.jdbc.batch_size=1000
spring.jpa.properties.hibernate.order_inserts=true

# Food duplicate detection (FR-2): minimum trigram name-similarity (0-1) and maximum relative
# macro/calory deviation (%) for two food items of the same source to be proposed as duplicates.
# Expected to need retuning after initial test runs, hence configurable rather than hard-coded.
food.duplicate-detection.name-similarity-threshold=0.5
food.duplicate-detection.macro-tolerance-percent=10
