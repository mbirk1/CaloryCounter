<div class="fixed bottom-4 right-4 z-50 flex flex-col gap-2">
  @for (toast of toastService.toasts(); track toast.id) {
    <div
      [attr.role]="toast.variant === 'error' ? 'alert' : 'status'"
      class="flex items-center gap-3 rounded-lg px-4 py-3 text-sm font-semibold shadow-lg min-w-64"
      [class.bg-tertiary]="toast.variant === 'success'"
      [class.text-white]="toast.variant === 'success'"
      [class.bg-red-50]="toast.variant === 'error'"
      [class.text-red-700]="toast.variant === 'error'"
    >
      <span class="flex-1">{{ toast.message }}</span>
      <button
        type="button"
        (click)="dismiss(toast.id)"
        aria-label="Meldung schließen"
        class="shrink-0 opacity-70 hover:opacity-100"
      >
        &times;
      </button>
    </div>
  }
</div>
